<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevRays Owner App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">

    <!-- Mobile App Container -->
    <div class="w-full max-w-md bg-white min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <header class="bg-gray-900 text-white p-6 rounded-b-3xl shadow-lg z-10">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <p class="text-gray-400 text-sm">Welcome back,</p>
                    <h1 class="text-2xl font-bold">DevRays Solar</h1>
                </div>
                <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-user text-gray-300"></i>
                </div>
            </div>
            <p class="text-sm opacity-80 mt-2"><i class="fa-solid fa-calendar-day mr-2"></i>Today's Business</p>
        </header>

        <!-- Main Content Area -->
        <div class="flex-1 p-6 space-y-4">
            
            <!-- Row 1: Calls & WhatsApp -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Calls Card -->
                <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 card-shadow flex flex-col items-center justify-center text-center">
                    <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-2">
                        <i class="fa-solid fa-phone text-xl"></i>
                    </div>
                    <h2 class="text-4xl font-bold text-gray-800">4</h2>
                    <p class="text-gray-500 text-xs font-semibold uppercase tracking-wider mt-1">Calls Today</p>
                </div>

                <!-- WhatsApp Card -->
                <div class="bg-green-50 p-5 rounded-2xl border border-green-100 card-shadow flex flex-col items-center justify-center text-center">
                    <div class="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-2">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                    </div>
                    <h2 class="text-4xl font-bold text-gray-800">7</h2>
                    <p class="text-gray-500 text-xs font-semibold uppercase tracking-wider mt-1">Enquiries</p>
                </div>
            </div>

            <!-- Row 2: Area & Ad Spend -->
            <div class="grid grid-cols-1 gap-4">
                <!-- Area Card -->
                <div class="bg-white p-5 rounded-2xl border border-gray-100 card-shadow flex items-center gap-4">
                    <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-location-dot text-xl"></i>
                    </div>
                    <div>
                        <p class="text-gray-400 text-xs font-bold uppercase">Area Reached</p>
                        <h3 class="text-lg font-bold text-gray-800">Nashik + 15 km</h3>
                    </div>
                </div>

                <!-- Ad Spend Card -->
                <div class="bg-white p-5 rounded-2xl border border-gray-100 card-shadow flex items-center gap-4">
                    <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-indian-rupee-sign text-xl"></i>
                    </div>
                    <div>
                        <p class="text-gray-400 text-xs font-bold uppercase">Ad Spend Today</p>
                        <h3 class="text-lg font-bold text-gray-800">₹180</h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- THE BIG BUTTON (Footer) -->
        <div class="p-6 mt-auto bg-white border-t border-gray-100">
            <button onclick="alert('Going to Screen 2: Lead Mode')" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold text-lg py-5 rounded-xl shadow-lg shadow-yellow-500/30 flex items-center justify-center gap-3 transition transform active:scale-95">
                <i class="fa-solid fa-fire text-red-600 animate-pulse"></i>
                GET MORE SOLAR LEADS
            </button>
            <p class="text-center text-xs text-gray-400 mt-3">DevRays Manager v1.0</p>
        </div>

    </div>

</body>
</html>
